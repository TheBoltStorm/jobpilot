# Skill list used by the local matcher. Edit or extend freely.
#
# key:
#   name:      display name
#   cat:       category (shown in the gap report)
#   aliases:   case-insensitive phrases matched on word boundaries
#   patterns:  optional case-SENSITIVE regexes, for short or ambiguous names (C, R, Go)
#   family:    skills in the same family give partial credit for each other
#   implies:   having this skill also shows you have these (PostgreSQL -> SQL)
#   learn:     a suggested way to learn it (free resource + a small project idea)

# ---------------------------------------------------------------- languages
python: {name: Python, cat: Languages, aliases: [python, python3], family: scripting,
  learn: "Python's official tutorial or CS50P (free). Project: a CLI tool that cleans and summarizes a CSV."}
java: {name: Java, cat: Languages, aliases: [java], family: jvm,
  learn: "University of Helsinki's free Java MOOC. Project: a REST API with Spring Boot."}
javascript: {name: JavaScript, cat: Languages, aliases: [javascript, js, es6, ecmascript], family: web_lang,
  learn: "The Odin Project or javascript.info (free). Project: an interactive to-do app with local storage."}
typescript: {name: TypeScript, cat: Languages, aliases: [typescript], family: web_lang, implies: [javascript],
  learn: "The TypeScript Handbook. Project: convert one of your JS projects to strict TypeScript."}
cpp: {name: C++, cat: Languages, aliases: ["c++", cpp, "c/c++"], family: c_family,
  learn: "learncpp.com (free). Project: implement a small hash map and benchmark it."}
c: {name: C, cat: Languages, patterns: ['(?<![\w+#./-])(?<!Series )(?<!Vitamin )(?<!Type )C(?![\w+#-])(?!\s*\+\+)', '\bC/C\+\+'], family: c_family,
  learn: "CS50's C weeks or 'Beej's Guide to C'. Project: a tiny shell or memory allocator."}
csharp: {name: "C#", cat: Languages, aliases: ["c#", csharp, ".net", dotnet], family: jvm,
  learn: "Microsoft Learn's free C# path. Project: a small ASP.NET Core API."}
go: {name: Go, cat: Languages, aliases: [golang], patterns: ['\bGo\b(?![-\s]+(?:to|above|beyond|live|further|forward|back)\b)(?!-)'], family: systems_lang,
  learn: "A Tour of Go + Go by Example. Project: a concurrent web crawler with goroutines."}
rust: {name: Rust, cat: Languages, aliases: [rust], family: systems_lang,
  learn: "The Rust Book (free). Project: a command-line grep clone."}
kotlin: {name: Kotlin, cat: Languages, aliases: [kotlin], family: jvm,
  learn: "Kotlin Koans + Android Basics with Compose. Project: a simple Android app."}
swift: {name: Swift, cat: Languages, aliases: [swift, swiftui], family: mobile_lang,
  learn: "Apple's Swift tutorials / 100 Days of SwiftUI. Project: a small iOS app."}
scala: {name: Scala, cat: Languages, aliases: [scala], family: jvm,
  learn: "Scala's official tour. Project: a Spark job written in Scala."}
r: {name: R, cat: Languages, patterns: ['(?<![\w&./-])R(?![\w&+#-])'], aliases: [rstudio, tidyverse], family: scripting,
  learn: "R for Data Science (free online book). Project: an exploratory analysis of a public dataset."}
sql: {name: SQL, cat: Data, aliases: [sql], family: sql,
  learn: "SQLBolt or Mode's SQL tutorial (free). Project: answer 10 questions about a public dataset in SQL."}
bash: {name: Bash/Shell, cat: Tools, aliases: [bash, shell scripting, shell scripts, zsh], family: scripting,
  learn: "The Missing Semester (MIT, free). Project: automate a chore on your machine with a script."}
matlab: {name: MATLAB, cat: Engineering, aliases: [matlab], family: scientific,
  learn: "MATLAB Onramp (free from MathWorks). Project: simulate and plot a control system."}
verilog: {name: Verilog/SystemVerilog, cat: Hardware, aliases: [verilog, systemverilog], family: hdl,
  learn: "HDLBits (free practice). Project: a UART or simple CPU on an FPGA simulator."}
vhdl: {name: VHDL, cat: Hardware, aliases: [vhdl], family: hdl,
  learn: "nandland's VHDL tutorials. Project: a traffic-light state machine."}
php: {name: PHP, cat: Languages, aliases: [php, laravel], family: web_lang,
  learn: "PHP: The Right Way. Project: a small Laravel CRUD app."}
ruby: {name: Ruby, cat: Languages, aliases: [ruby, rails, ruby on rails], family: scripting,
  learn: "The Odin Project's Ruby path. Project: a Rails blog."}

