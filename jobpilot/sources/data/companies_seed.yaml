# Starter list of companies with public job boards. Every token was checked against the live
# API on 2026-11-17 and had open postings. Boards change, so `jobpilot discover` reports any
# that start failing. Field tags: software, data, product, hardware, quant, security, design.
#
# `jobpilot companies init` copies the ones matching your target fields into data/companies.yaml,
# which is the file you edit.

