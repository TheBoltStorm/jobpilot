[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.1.0"
description = "Local job-search assistant: finds matching jobs, pre-fills applications, flags skill gaps. Never submits for you."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fpdf2>=2.7"]
claude = ["anthropic>=2.0,<3"]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[tool.setuptools.packages.find]
include = ["jobpilot*"]

[tool.setuptools.package-data]
"jobpilot.sources" = ["data/*.yaml"]
"jobpilot.matching" = ["data/*.yaml"]
"jobpilot.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
